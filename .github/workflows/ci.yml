name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: darukaa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/darukaa_test
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: password
          TEST_DB_DEFAULT: darukaa_test
          TEST_DB_NAME: darukaa_test
          SECRET_KEY: test_secret_key_ci_only
          ALGORITHM: HS256
        run: |
          cd backend
          pytest -v

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Build
        env:
          # A dummy token is needed so the build doesn't fail if the code relies on it
          VITE_MAPBOX_TOKEN: pk.dummy.token.for.ci
        run: |
          cd frontend
          npm run build
