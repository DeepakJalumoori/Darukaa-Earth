services:
  db:
    image: postgis/postgis:16-3.4
    container_name: darukaa-db
    environment:
      POSTGRES_DB: darukaa
      POSTGRES_USER: darukaa
      POSTGRES_PASSWORD: darukaa_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darukaa"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
